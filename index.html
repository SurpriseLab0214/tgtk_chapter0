<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微醺大飯店：Before You Arrive</title>
    <style>
        /* 清除瀏覽器預設的邊界與縫隙 */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* 底色設為黑色 */
            width: 100%;
            overflow-x: hidden; /* 絕對禁止網頁左右滑動 */
            /* 針對某些舊版瀏覽器的圖片間隙做終極防禦 */
            font-size: 0; 
            line-height: 0;
        }

        /* 圖片外層容器 */
        .comic-container {
            width: 100%;
            max-width: 800px; /* 若在電腦上開啟，最大寬度為 800px 避免過度放大；手機則會自動 100% 滿版 */
            margin: 0 auto; /* 電腦版時置中對齊 */
            display: flex;
            flex-direction: column;
        }

        /* 條漫圖片的關鍵設定 */
        .comic-img {
            width: 100%;
            height: auto;
            display: block; /* 消除圖片下方的神祕空白 */
            margin: 0;
            padding: 0;
            border: none;
            /* 確保不同尺寸的圖片都能強制拉伸貼齊邊緣 */
            object-fit: cover; 
        }
    </style>
</head>
<body>

    <div class="comic-container">
        <!-- 首兩張圖優先載入，確保進站體驗 -->
        <img src="P1.webp" class="comic-img" alt="P1">
        <img src="P2.webp" class="comic-img" alt="P2">
        
        <!-- 第三張圖開始使用延遲載入 (lazy) -->
        <img src="P3.webp" class="comic-img" loading="lazy" alt="P3">
        <img src="P4.webp" class="comic-img" loading="lazy" alt="P4">
        <img src="P5.webp" class="comic-img" loading="lazy" alt="P5">
        <img src="P6.webp" class="comic-img" loading="lazy" alt="P6">
        <img src="P7.webp" class="comic-img" loading="lazy" alt="P7">
        <img src="P8.webp" class="comic-img" loading="lazy" alt="P8">
        <img src="P9.webp" class="comic-img" loading="lazy" alt="P9">
        <img src="P10.webp" class="comic-img" loading="lazy" alt="P10">
        <img src="P11.webp" class="comic-img" loading="lazy" alt="P11">
        <img src="P12.webp" class="comic-img" loading="lazy" alt="P12">
        <img src="P13.webp" class="comic-img" loading="lazy" alt="P13">
        <img src="P14.webp" class="comic-img" loading="lazy" alt="P14">
        <img src="P15.webp" class="comic-img" loading="lazy" alt="P15">
        <img src="P16.webp" class="comic-img" loading="lazy" alt="P16">
        <img src="P17.webp" class="comic-img" loading="lazy" alt="P17">
        <img src="P18.webp" class="comic-img" loading="lazy" alt="P18">
    </div>

    <!-- 頁尾按鈕 -->
    <div style="
        background-color: #1a1008;
        background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><circle cx=%2230%22 cy=%2230%22 r=%2220%22 fill=%22none%22 stroke=%22%23c8a96e%22 stroke-width=%220.3%22 opacity=%220.3%22/></svg>');
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 0 40px;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
    ">
        <a href="https://www.surpriselab.com.tw/thegreattipsy" style="
            display: inline-block;
            background-color: #f5ecd4;
            color: #1a1008;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            padding: 16px 48px;
            border-radius: 50px;
            letter-spacing: 4px;
            font-family: 'Noto Serif TC', serif;
        ">回到官網</a>
    </div>

</body>

</html>
